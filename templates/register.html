{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Create Account</h4>
        <div id="error-msg" class="alert alert-danger d-none"></div>
        <div id="success-msg" class="alert alert-success d-none"></div>
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-dark w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="/login/">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-msg');
    const successEl = document.getElementById('success-msg');
    errorEl.classList.add('d-none');
    successEl.classList.add('d-none');

    const res = await fetch(`${API}/api/auth/register/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    if (res.ok) {
      successEl.textContent = 'Account created! Redirecting to login...';
      successEl.classList.remove('d-none');
      setTimeout(() => window.location.href = '/login/', 1500);
    } else {
      const err = await res.json();
      const msg = Object.values(err).flat().join(' ');
      errorEl.textContent = msg || 'Registration failed';
      errorEl.classList.remove('d-none');
    }
  });
</script>
{% endblock %}
