<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Nearby Services Finder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  {% block extra_css %}{% endblock %}
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">📍 Nearby Services</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/map/">Map</a></li>
        <li class="nav-item staff-admin-only d-none"><a class="nav-link" href="/services/">Services</a></li>
        <li class="nav-item admin-only d-none"><a class="nav-link" href="/admin-panel/">Admin Panel</a></li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item auth-logged-in d-none">
          <span class="navbar-text text-light me-3">
            Hello, <strong id="nav-username"></strong> (<span id="nav-role"></span>)
          </span>
        </li>
        <li class="nav-item auth-logged-in d-none">
          <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </li>
        <li class="nav-item auth-logged-out">
          <a class="btn btn-outline-light btn-sm me-2" href="/login/">Login</a>
        </li>
        <li class="nav-item auth-logged-out">
          <a class="btn btn-light btn-sm" href="/register/">Register</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = 'http://127.0.0.1:8000';

  function getToken() { return localStorage.getItem('access'); }
  function getRefresh() { return localStorage.getItem('refresh'); }
  function getRole() { return localStorage.getItem('role'); }
  function getUsername() { return localStorage.getItem('username'); }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() };
  }

  async function refreshToken() {
    const res = await fetch(`${API}/api/auth/refresh/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: getRefresh() })
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('access', data.access);
      return true;
    }
    logout();
    return false;
  }

  async function apiFetch(url, options = {}) {
    let res = await fetch(url, { ...options, headers: authHeaders() });
    if (res.status === 401) {
      const refreshed = await refreshToken();
      if (refreshed) res = await fetch(url, { ...options, headers: authHeaders() });
    }
    return res;
  }

  function logout() {
    localStorage.clear();
    window.location.href = '/login/';
  }

  function updateNavbar() {
    const token = getToken();
    const role = getRole();
    const username = getUsername();
    if (token) {
      document.querySelectorAll('.auth-logged-in').forEach(el => el.classList.remove('d-none'));
      document.querySelectorAll('.auth-logged-out').forEach(el => el.classList.add('d-none'));
      document.getElementById('nav-username').textContent = username || '';
      document.getElementById('nav-role').textContent = role || '';
      if (role === 'STAFF' || role === 'ADMIN') {
        document.querySelectorAll('.staff-admin-only').forEach(el => el.classList.remove('d-none'));
      }
      if (role === 'ADMIN') {
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('d-none'));
      }
    } else {
      document.querySelectorAll('.auth-logged-in').forEach(el => el.classList.add('d-none'));
      document.querySelectorAll('.auth-logged-out').forEach(el => el.classList.remove('d-none'));
    }
  }

  function requireAuth() {
    if (!getToken()) window.location.href = '/login/';
  }

  document.addEventListener('DOMContentLoaded', updateNavbar);
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
